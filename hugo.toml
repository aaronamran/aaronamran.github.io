baseURL = 'https://aaronamran.github.io/'
languageCode = 'en-us'
title = 'aaronamran'

disableKinds = ['taxonomy', 'term', 'rss']

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  title = true

[imaging]
  quality = 85
  resampleFilter = 'Lanczos'
  [imaging.exif]
    includeFields = ''
    excludeFields = '.*'
    disableDate = true
    disableLatLong = true
