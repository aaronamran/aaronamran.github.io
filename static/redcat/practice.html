<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aaronamran</title>
    <link rel="icon" type="image/png" href="redcat.webp">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="main-app">
        <!-- Left Panel: Section Info & Tasks -->
        <aside class="left-panel">
            <header class="section-header">
                <h1 id="section-title">Loading...</h1>
                <p id="section-description"></p>
                <div class="stats">
                    <span class="stat">
                        <a href="#" id="notes-btn" class="notes-link">Notes</a>
                    </span>
                    <span class="stat">
                        <strong>Points:</strong> 
                        <span id="current-points">0</span> / <span id="total-points">0</span>
                    </span>
                    <span class="stat">
                        <strong>Section:</strong> 
                        <span id="current-section">1</span> / <span id="total-sections">3</span>
                    </span>
                </div>
            </header>

            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <div class="tasks-container">
                <h2>Tasks</h2>
                <ul id="task-list"></ul>
            </div>

            <div class="section-navigation">
                <button id="prev-section" class="nav-btn" disabled>← Previous Section</button>
                <button id="next-section" class="nav-btn" disabled>Next Section →</button>
            </div>
        </aside>

        <!-- Right Panel: Terminal Interface -->
        <main class="right-panel">
            <div class="terminal-header">
                <div class="terminal-title">
                    <img src="redcat.webp" alt="Red Hat" class="redhat-logo">
                    <span class="os-badge">Red Cat</span>
                    <span class="terminal-name" id="terminal-name">by <a href="https://aaronamran.github.io" target="_blank"><u>aaronamran</u></a></span>
                </div>
                <div class="terminal-header-actions">
                    <a href="index.html" class="control-btn home-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Home
                    </a>
                    <button id="select-chapter-btn" class="control-btn select-chapter-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        Select Chapter
                    </button>
                    <a href="https://ko-fi.com/aaronamran" target="_blank" class="kofi-icon-link" title="Support on Ko-fi">
                        <svg class="kofi-icon-tiny" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 1.832 3.011.723 4.311zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"/>
                        </svg>
                        <span>Support on Ko-fi</span>
                    </a>
                    <button id="clear-history" class="control-btn clear-btn">Clear History</button>
                    <button id="reset-section" class="control-btn reset-btn">Reset Section</button>
                    <button id="reset-all" class="control-btn reset-danger-btn">Reset All</button>
                </div>
            </div>

            <div class="terminal-content">
                <!-- Command History -->
                <div id="command-history" class="command-history"></div>

                <!-- Terminal Input Line -->
                <div class="terminal-input-line">
                    <span class="terminal-prompt">[root@redcat ~]$ </span>
                    <input 
                        type="text" 
                        id="terminal-input" 
                        class="terminal-input" 
                        autocomplete="off" 
                        spellcheck="false"
                        autofocus
                    />
                </div>

                <!-- Hint instructions -->
                <div class="terminal-hint-info">Use &lt;command&gt; -h for help or use &lt;command&gt; -h | grep &lt;keyword&gt; to filter</div>
            </div>
        </main>
    </div>

    <!-- Notes Modal -->
    <div id="notes-modal" class="notes-modal">
        <div class="notes-modal-content">
            <div class="notes-modal-header">
                <h2 id="notes-modal-title">Section Notes</h2>
                <button id="notes-close-btn" class="notes-close-btn">&times;</button>
            </div>
            <div class="notes-modal-body">
                <div id="notes-content">No notes available for this section yet.</div>
            </div>
        </div>
    </div>

    <!-- Chapter Selection Modal -->
    <div id="chapter-modal" class="chapter-modal-overlay">
        <div class="notes-modal-content chapter-modal-content">
            <div class="notes-modal-header">
                <h2>Select Chapter</h2>
                <button id="chapter-close-btn" class="notes-close-btn">&times;</button>
            </div>
            <div class="notes-modal-body">
                <div class="chapter-grid" id="chapter-grid">
                    <!-- Chapters will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts - Modular Architecture -->
    <!-- Core Modules (load first) -->
    <script src="terminal/datetime.js"></script>
    <script src="terminal/filesystem-utils.js"></script>
    <script src="modules/state.js"></script>
    <script src="modules/validation.js"></script>
    <script src="modules/output/output-core.js"></script>
    <script src="modules/output/output-section1.js"></script>
    <script src="modules/output/output-section2.js"></script>
    <script src="modules/output/output-section3.js"></script>
    <script src="modules/output/output-section4.js"></script>
    <script src="modules/output/output-section5.js"></script>
    <script src="modules/output/output-section6.js"></script>
    <script src="modules/output/output-section7.js"></script>
    <script src="modules/output/output-section8.js"></script>
    <script src="modules/output/output-section9.js"></script>
    <script src="modules/output/output-section10.js"></script>
    <script src="modules/output/output-section11.js"></script>
    <script src="modules/output/output-section12.js"></script>
    <script src="modules/output/output-section13.js"></script>
    <script src="modules/output/output-section14.js"></script>
    <script src="modules/output/output-section15.js"></script>
    <script src="modules/output/output-section16.js"></script>
    <script src="modules/output/output-section17.js"></script>
    <script src="modules/output/output-section18.js"></script>
    <script src="modules/output/output-section19.js"></script>
    <script src="modules/output/output-section20.js"></script>
    <script src="modules/ui.js"></script>
    
    <!-- Data & Helper Modules -->
    <script src="help.js"></script>
    <script src="notes.js"></script>
    
    <!-- Section Data (load before data.js) -->
    <script src="sections/section1-essential-tools.js"></script>
    <script src="sections/section2-users-and-groups.js"></script>
    <script src="sections/section3-permissions-and-acls.js"></script>
    <script src="sections/section4-shell-scripting.js"></script>
    <script src="sections/section5-storage-lvm.js"></script>
    <script src="sections/section6-storage-filesystems.js"></script>
    <script src="sections/section7-remote-resources.js"></script>
    <script src="sections/section8-systemd-processes.js"></script>
    <script src="sections/section9-system-tuning.js"></script>
    <script src="sections/section10-networking.js"></script>
    <script src="sections/section11-network-security.js"></script>
    <script src="sections/section12-selinux.js"></script>
    <script src="sections/section13-software-management.js"></script>
    <script src="sections/section14-task-scheduling.js"></script>
    <script src="sections/section15-boot-maintenance.js"></script>
    <script src="sections/section16-rootless-containers.js"></script>
    <script src="sections/section17-time-services.js"></script>
    <script src="sections/section18-flatpak.js"></script>
    <script src="sections/section19-root-password-reset.js"></script>
    <script src="sections/section20-root-password-reset-bash.js"></script>
    
    <!-- Data Loader (depends on section files) -->
    <script src="data.js"></script>
    
    <!-- Vi Modal Editor for Section 4 -->
    <script src="terminal/vi/vi-modal.js"></script>
    <script src="terminal/vi/vi-validator.js"></script>
    
    <!-- Boot Simulator Modal for Section 19 -->
    <script src="terminal/boot-simulator/boot-modal.js"></script>
    
    <!-- Main Application Orchestrator (load last) -->
    <script src="app.js"></script>

    <!-- Initialize practice mode from sessionStorage -->
    <script>
        // Read practice configuration from sessionStorage (set by landing.html)
        const practiceMode = sessionStorage.getItem('redcat-practice-mode') || 'default';
        const startSection = parseInt(sessionStorage.getItem('redcat-start-section')) || 1;
        
        console.log(`🎯 Practice Mode: ${practiceMode}, Starting Section: ${startSection}`);
        
        // Initialize app state before loading progress
        if (typeof appState !== 'undefined') {
            appState.currentSectionId = startSection;
            appState.practiceMode = practiceMode;
            
            // Try to load existing progress, but respect the starting section from landing if it's a new session
            const hasExistingProgress = localStorage.getItem('appState');
            if (!hasExistingProgress) {
                // No existing progress, save the initial state
                if (typeof saveProgress === 'function') {
                    saveProgress();
                }
            }
        }
        
        // Auto-initialize the app
        if (typeof initApp === 'function') {
            initApp();
        } else {
            console.error('❌ initApp function not found');
        }
        
        // Clear the session storage values after reading them
        sessionStorage.removeItem('redcat-practice-mode');
        sessionStorage.removeItem('redcat-start-section');

        // Chapter Selection Modal Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const chapterModal = document.getElementById('chapter-modal');
            const selectChapterBtn = document.getElementById('select-chapter-btn');
            const chapterCloseBtn = document.getElementById('chapter-close-btn');
            const chapterGrid = document.getElementById('chapter-grid');

            // Populate chapter grid
            function populateChapterGrid() {
                if (typeof sections === 'undefined') {
                    console.error('❌ Sections not loaded');
                    return;
                }

                chapterGrid.innerHTML = '';
                sections.forEach(section => {
                    const chapterCard = document.createElement('div');
                    chapterCard.className = 'chapter-card';
                    if (section.id === appState.currentSectionId) {
                        chapterCard.classList.add('current-chapter');
                    }

                    chapterCard.innerHTML = `
                        <div class="chapter-number">Section ${section.id}</div>
                        <div class="chapter-title">${section.title}</div>
                        <div class="chapter-description">${section.description}</div>
                    `;

                    chapterCard.addEventListener('click', function() {
                        if (section.id !== appState.currentSectionId) {
                            // Switch to selected section
                            loadSection(section.id);
                            chapterModal.style.display = 'none';
                        }
                    });

                    chapterGrid.appendChild(chapterCard);
                });
            }

            // Open chapter modal
            selectChapterBtn.addEventListener('click', function() {
                populateChapterGrid();
                chapterModal.style.display = 'flex';
            });

            // Close chapter modal
            chapterCloseBtn.addEventListener('click', function() {
                chapterModal.style.display = 'none';
            });

            // Close modal when clicking outside
            chapterModal.addEventListener('click', function(e) {
                if (e.target === chapterModal) {
                    chapterModal.style.display = 'none';
                }
            });

            // Close modal on Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && chapterModal.style.display === 'flex') {
                    chapterModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
